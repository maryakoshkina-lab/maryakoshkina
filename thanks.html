<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо — Маря Кошкина</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #fefef7;
            color: #1f1e1e;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: #fff;
            border-radius: 30px;
            padding: 50px 30px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.05);
            border: 1px solid #f0ece4;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            color: #9e5d4c;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.2rem;
            color: #4a4a46;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #b8a07c;
            color: #fff;
            padding: 12px 36px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover {
            background: #9a8262;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Спасибо!</h1>
        <p>Мы получили ваш запрос. <br>Свяжемся с вами в ближайшее время.</p>
        <a href="index.html" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
