<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Маря Кошкина</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #fefef7;
            color: #1f1e1e;
            line-height: 1.6;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        header {
            background: #fff;
            padding: 16px 0;
            border-bottom: 1px solid #e6e6e0;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo a {
            font-size: 1.6rem;
            font-weight: 500;
            color: #1f1e1e;
            text-decoration: none;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a4a46;
            font-size: 0.95rem;
            padding: 6px 14px;
            border-radius: 40px;
            background: rgba(184,160,124,0.08);
            transition: 0.3s;
        }
        nav a:hover {
            background: #b8a07c;
            color: #fff;
        }

        .profile-section {
            padding: 40px 0 60px;
        }
        .profile-section h1 {
            font-size: 2.2rem;
            font-weight: 300;
            border-left: 4px solid #b8a07c;
            padding-left: 20px;
            margin-bottom: 30px;
        }

        .login-form {
            max-width: 400px;
            margin: 40px auto;
            background: #fff;
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            border: 1px solid #f0ece4;
            text-align: center;
        }
        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .login-form input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 60px;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
        }
        .login-form input:focus { border-color: #b8a07c; }
        .login-form button {
            background: #b8a07c;
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-form button:hover { background: #9a8262; }

        .logout-btn {
            background: #b8a07c;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover { background: #9a8262; }

        .program-block {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            border: 1px solid #f0ece4;
            padding: 20px 24px;
            margin-bottom: 30px;
        }
        .program-block h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .program-block h2 span {
            font-size: 1rem;
            font-weight: 400;
            color: #5e5e5a;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f0ece4;
        }
        .lesson-item:last-child { border-bottom: none; }
        .lesson-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #b8a07c;
            cursor: pointer;
            flex-shrink: 0;
        }
        .lesson-item label {
            cursor: pointer;
            flex-grow: 1;
            font-size: 0.95rem;
        }
        .lesson-item.completed label {
            text-decoration: line-through;
            color: #888;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e6e6e0;
            border-radius: 10px;
            margin: 8px 0 16px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #b8a07c;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 16px 20px;
            background: #faf8f3;
            border-radius: 20px;
        }
        .stats-item {
            font-size: 1.1rem;
        }
        .stats-item strong {
            font-weight: 600;
            color: #9e5d4c;
        }

        footer {
            background: #f5f3ed;
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid #e2dfd7;
            font-size: 0.9rem;
            color: #5e5e5a;
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            .program-block h2 { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>

<header>
    <div class="container header-inner">
        <div class="logo"><a href="index.html">Маря Кошкина</a></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="profile.html">Личный кабинет</a>
        </nav>
    </div>
</header>

<main>
    <section class="profile-section">
        <div class="container">
            <h1>📋 Мой прогресс</h1>

            <!-- Блок входа/приветствия -->
            <div id="loginArea">
                <div class="login-form" id="loginForm">
                    <h2 style="margin-bottom: 12px; font-weight: 400;">Введите ваше имя</h2>
                    <p style="margin-bottom: 16px; color: #5e5e5a;">Чтобы сохранять прогресс</p>
                    <label for="usernameInput">Ваше имя:</label>
                    <input type="text" id="usernameInput" placeholder="Например, Мария">
                    <button id="loginBtn">Войти</button>
                </div>
            </div>

            <!-- Содержимое кабинета (скрыто до входа) -->
            <div id="cabinet" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                    <div>
                        <p style="font-size: 1.2rem;">Привет, <strong id="displayName"></strong>!</p>
                    </div>
                    <button class="logout-btn" id="logoutBtn">Выйти</button>
                </div>

                <!-- Общая статистика -->
                <div class="stats" id="statsContainer">
                    <div class="stats-item">Всего уроков: <strong id="totalLessons">0</strong></div>
                    <div class="stats-item">Пройдено: <strong id="completedLessons">0</strong></div>
                    <div class="stats-item">Общий прогресс: <strong id="overallProgress">0%</strong></div>
                </div>

                <!-- Список программ с уроками -->
                <div id="programsContainer"></div>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>© 2026 Маря Кошкина — Личный кабинет</p>
        <p><a href="index.html" style="color:#9e5d4c;">Вернуться на главную</a></p>
    </div>
</footer>

<script>
    // ======= ДАННЫЕ ПРОГРАММ =======
    const programsData = [
        {
            id: 'lab',
            name: '🔹 Лаборатория внутренних опор',
            lessons: ['Урок 1. Встреча с собой', 'Урок 2. Тело как якорь', 'Урок 3. Творчество как дыхание', 'Урок 4. Любовь к себе']
        },
        {
            id: 'singing',
            name: '🔸 Поющие круги рефлексии',
            lessons: ['Голос', 'Танец', 'Слово']
        },
        {
            id: 'muza',
            name: '🔸 Проект «Муза»',
            lessons: [
                '1. Утренние страницы', '2. Дофаминовое голодание', '3. Правило трёх',
                '4. Техника десяти вопросов', '5. Диалог с будущей собой',
                '6. Билатеральная стимуляция', '7. Скука как топливо', '8. Телесный якорь',
                '9. Ассоциативные карты', '10. Письмо от Музы'
            ]
        },
        {
            id: 'neuro_breath',
            name: '🧠 Нейро-дыхательные практики',
            lessons: [
                '1. Физиологический вздох', '2. Опора на выдох', '3. Пение как нейрохакинг',
                '4. Вопрос к себе', '5. Квадратное дыхание с пением'
            ]
        },
        {
            id: 'neuro_aid',
            name: '🧰 Нейро-аптечка',
            lessons: [
                '1. Холодная вода', '2. Тряска', '3. Боковое зрение', '4. Надавливание на грудь',
                '5. Прямой взгляд', '6. Подъём на носки', '7. Массаж ушей',
                '8. Поза «Гора»', '9. Постукивание', '10. Дыхание через сжатые губы'
            ]
        },
        {
            id: 'neuro_games',
            name: '🎮 Нейробиологические упражнения',
            lessons: [
                '1. Зеркальный звук', '2. Гудение в тело', '3. Ритмический диалог',
                '4. Пение с помехой', '5. Эмоциональный вокал'
            ]
        },
        {
            id: 'tech',
            name: '🔹 Технологии и Муза 2.0',
            lessons: [
                'Звуковой дизайн', 'Нейроинтерфейсы', 'Алгоритмическая композиция', 'Рефлексия через данные'
            ]
        },
        {
            id: 'course_osoznanie',
            name: '🧠 Цифровой курс «Осознанный отказ»',
            lessons: [
                'День 1: Пробуждение', 'День 2: Перезагрузка дофамина', 'День 3: Дыхание как якорь',
                'День 4: Замена привычки', 'День 5: Генетика и травма', 'День 6: Тело как союзник',
                'День 7: Интеграция'
            ]
        }
    ];

    // ======= РАБОТА С ХРАНИЛИЩЕМ =======
    function getStorageKey(username) {
        return `user_progress_${username}`;
    }

    function loadProgress(username) {
        const key = getStorageKey(username);
        const data = localStorage.getItem(key);
        if (data) {
            try {
                return JSON.parse(data);
            } catch(e) { return {}; }
        }
        return {};
    }

    function saveProgress(username, progress) {
        const key = getStorageKey(username);
        localStorage.setItem(key, JSON.stringify(progress));
    }

    // ======= ОТРИСОВКА ИНТЕРФЕЙСА =======
    function renderPrograms(username, progress) {
        const container = document.getElementById('programsContainer');
        container.innerHTML = '';
        let totalLessons = 0;
        let completedLessons = 0;

        programsData.forEach(prog => {
            const progId = prog.id;
            const lessons = prog.lessons;
            const progProgress = progress[progId] || {};

            // Считаем сколько уроков в этой программе уже отмечено
            let progCompleted = 0;
            lessons.forEach((lesson, index) => {
                if (progProgress[index]) progCompleted++;
            });
            const progTotal = lessons.length;
            totalLessons += progTotal;
            completedLessons += progCompleted;

            // Блок программы
            const block = document.createElement('div');
            block.className = 'program-block';

            const header = document.createElement('h2');
            header.innerHTML = `${prog.name} <span>${progCompleted}/${progTotal}</span>`;
            block.appendChild(header);

            // Прогресс-бар
            const bar = document.createElement('div');
            bar.className = 'progress-bar';
            const fill = document.createElement('div');
            fill.className = 'fill';
            const percent = progTotal === 0 ? 0 : Math.round((progCompleted / progTotal) * 100);
            fill.style.width = percent + '%';
            bar.appendChild(fill);
            block.appendChild(bar);

            // Список уроков
            lessons.forEach((lesson, index) => {
                const item = document.createElement('div');
                item.className = 'lesson-item';
                if (progProgress[index]) {
                    item.classList.add('completed');
                }

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !!progProgress[index];
                checkbox.addEventListener('change', function() {
                    // Обновляем прогресс
                    const newProgress = loadProgress(username);
                    if (!newProgress[progId]) newProgress[progId] = {};
                    newProgress[progId][index] = this.checked;
                    saveProgress(username, newProgress);
                    // Перерисовываем всё
                    renderPrograms(username, loadProgress(username));
                    updateStats(username);
                });

                const label = document.createElement('label');
                label.textContent = lesson;

                item.appendChild(checkbox);
                item.appendChild(label);
                block.appendChild(item);
            });

            container.appendChild(block);
        });

        // Обновляем статистику в шапке
        document.getElementById('totalLessons').textContent = totalLessons;
        document.getElementById('completedLessons').textContent = completedLessons;
        const overallPercent = totalLessons === 0 ? 0 : Math.round((completedLessons / totalLessons) * 100);
        document.getElementById('overallProgress').textContent = overallPercent + '%';
    }

    function updateStats(username) {
        const progress = loadProgress(username);
        // Пересчёт делается внутри renderPrograms, но мы можем обновить только статистику без перерисовки всех программ? 
        // Проще перерисовать всё, но можно и оптимизировать. Так как у нас небольшие данные, перерисуем всё.
        renderPrograms(username, progress);
    }

    // ======= ВХОД / ВЫХОД =======
    let currentUser = null;

    function login(username) {
        if (!username.trim()) {
            alert('Пожалуйста, введите ваше имя.');
            return;
        }
        currentUser = username.trim();
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('cabinet').style.display = 'block';
        document.getElementById('displayName').textContent = currentUser;

        const progress = loadProgress(currentUser);
        renderPrograms(currentUser, progress);
    }

    function logout() {
        currentUser = null;
        document.getElementById('cabinet').style.display = 'none';
        document.getElementById('loginArea').style.display = 'block';
        document.getElementById('usernameInput').value = '';
        // Очищаем контейнер
        document.getElementById('programsContainer').innerHTML = '';
        document.getElementById('totalLessons').textContent = '0';
        document.getElementById('completedLessons').textContent = '0';
        document.getElementById('overallProgress').textContent = '0%';
    }

    // ======= ИНИЦИАЛИЗАЦИЯ =======
    document.addEventListener('DOMContentLoaded', function() {
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('usernameInput');
        const logoutBtn = document.getElementById('logoutBtn');

        // Проверяем, есть ли сохранённое имя
        const savedUser = localStorage.getItem('last_user');
        if (savedUser) {
            // Автоматически входим
            login(savedUser);
        } else {
            document.getElementById('loginArea').style.display = 'block';
            document.getElementById('cabinet').style.display = 'none';
        }

        loginBtn.addEventListener('click', function() {
            const name = usernameInput.value.trim();
            if (name) {
                localStorage.setItem('last_user', name);
                login(name);
            } else {
                alert('Введите имя');
            }
        });

        // Вход по Enter
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        logoutBtn.addEventListener('click', function() {
            if (confirm('Вы уверены, что хотите выйти? Ваш прогресс сохранится.')) {
                localStorage.removeItem('last_user');
                logout();
            }
        });
    });
</script>
</body>
</html>
